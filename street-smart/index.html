<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a12">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<title>Street Smart</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="safe-probe"></div>
<div id="loading"><div class="logo">STREET SMART</div><div class="bar"><i></i></div><div class="sub">Loading…</div></div>
<div id="rotate"><div class="phone"></div><h2>Please rotate your device</h2><p>Street Smart is played in landscape</p></div>

<!-- Game code: plain JS, no frameworks, no network requests. -->
<script src="js/config.js"></script>
<script>
  // single source of truth for the title / strings, even on the HTML screens
  (function () {
    var C = SS.CONFIG, S = SS.STRINGS;
    document.title = C.TITLE.charAt(0) + C.TITLE.slice(1).toLowerCase().replace(/ (.)/g, function (m, c) { return ' ' + c.toUpperCase(); });
    document.querySelector('#loading .logo').textContent = C.TITLE;
    document.querySelector('#loading .sub').textContent = S.loading;
    document.querySelector('#rotate h2').textContent = S.rotate;
    document.querySelector('#rotate p').textContent = S.rotateSub;
  })();
</script>
<script src="js/save.js"></script>
<script src="js/banhbao-clip.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/input.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/story.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
